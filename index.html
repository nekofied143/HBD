<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>🎉 Happy Birthday 🎂</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Fireworks Canvas -->
    <canvas id="fireworks"></canvas>

    <!-- Main Content -->
    <main class="container">

        <!-- Birthday Title -->
        <h1 id="title">
            🎂 Happy Birthday! 🎂
        </h1>

        <!-- Random Birthday Message -->
        <div
            class="message"
            id="birthday-message"
        >
            Loading birthday wishes...
        </div>

        <!-- Birthday Cake -->
        <div class="cake">

            <!-- Bottom Layer -->
            <div class="layer layer1">
                <div class="icing"></div>
            </div>

            <!-- Middle Layer -->
            <div class="layer layer2">
                <div class="icing"></div>
            </div>

            <!-- Top Layer -->
            <div class="layer layer3">

                <div class="icing"></div>

                <!-- Candle 1 -->
                <div class="candle c1">
                    <div class="flame"></div>
                </div>

                <!-- Candle 2 -->
                <div class="candle c2">
                    <div class="flame"></div>
                </div>

                <!-- Candle 3 -->
                <div class="candle c3">
                    <div class="flame"></div>
                </div>

            </div>

        </div>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
