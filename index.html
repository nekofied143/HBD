<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>🎉 Happy Birthday 🎂</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Fireworks Canvas -->
    <canvas id="fireworks"></canvas>

    <!-- Main Content -->
    <main class="container">

        <h1 id="title">
            🎂 Happy Birthday! 🎂
        </h1>

        <div
            class="message"
            id="birthday-message"
        >
            Loading birthday wishes...
        </div>

        <!-- Birthday Cake -->
        <div class="cake">

            <div class="layer layer1">
                <div class="icing"></div>
            </div>

            <div class="layer layer2">
                <div class="icing"></div>
            </div>

            <div class="layer layer3">

                <div class="icing"></div>

                <div class="candle c1">
                    <div class="flame"></div>
                </div>

                <div class="candle c2">
                    <div class="flame"></div>
                </div>

                <div class="candle c3">
                    <div class="flame"></div>
                </div>

            </div>

        </div>

    </main>

    <!-- Floating Add Button -->
    <button
        id="addCelebrantBtn"
        class="fab"
        title="Add Celebrant"
        aria-label="Add Celebrant"
    >
        +
    </button>

    <!-- Modal -->
    <div
        id="celebrantModal"
        class="modal"
    >

        <div class="modal-card">

            <div class="modal-header">

                <h2>Add Celebrant</h2>

                <button
                    id="closeModal"
                    class="close-btn"
                    type="button"
                >
                    ×
                </button>

            </div>

            <form id="celebrantForm">

                <div class="form-group">

                    <label for="nickname">
                        Nickname
                    </label>

                    <input
                        id="nickname"
                        type="text"
                        maxlength="30"
                        placeholder="e.g. John"
                        autocomplete="off"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="birthday">
                        Birthday (MM-DD)
                    </label>

                    <input
                        id="birthday"
                        type="text"
                        placeholder="07-29"
                        maxlength="5"
                        pattern="^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
                        required
                    >

                </div>

                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelBtn"
                        class="btn-secondary"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn-primary"
                    >
                        Save Celebrant
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Script -->
    <script src="script.js"></script>

</body>

</html>
