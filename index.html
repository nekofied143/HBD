<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Happy Birthday</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

margin:0;

overflow-x:hidden;
overflow-y:auto;

min-height:100vh;

font-family:Poppins,sans-serif;
background:linear-gradient(135deg,#ff4d6d,#ff9a3c,#6c63ff,#00c6ff);
background-size:400% 400%;
animation:bg 12s infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
z-index:1;
}

.container{
    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    width:100%;
    min-height:100vh;

    padding:20px;
    text-align:center;
}

h1{
animation:zoom 2s infinite alternate;
font-family:Pacifico,cursive;
font-size:clamp(2rem,8vw,5rem);
line-height:1.2;
padding:0 10px;
text-shadow:0 0 20px gold;
word-break:break-word;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

.message{
    margin-top:15px;
    width:min(90%,700px);
    font-size:clamp(1rem,3vw,1.4rem);
    line-height:1.7;
}

.cake{
position:relative;

width:min(220px,55vw);
height:min(220px,55vw);

margin-top:40px;

transform:scale(1);
}

.layer{
position:absolute;
left:50%;
transform:translateX(-50%);
border-radius:12px;
}

.layer1{
bottom:0;
width:220px;
height:60px;
background:#ffb703;
}

.layer2{
bottom:60px;
width:180px;
height:55px;
background:#ff7b7b;
}

.layer3{
bottom:115px;
width:140px;
height:50px;
background:#fff;
}

.icing{
position:absolute;
top:-8px;
left:0;
width:100%;
height:18px;
background:#fff;
border-radius:20px;
}

.candle{
position:absolute;
width:10px;
height:45px;
background:white;
top:-45px;
}

.c1{left:25%;}
.c2{left:50%;}
.c3{left:75%;}

.flame{
position:absolute;
top:-14px;
left:-5px;
width:20px;
height:20px;
background:gold;
border-radius:50%;
filter:blur(1px);
animation:flicker .15s infinite alternate;
}

@keyframes flicker{
from{
transform:scale(1);
background:#ffd60a;
}
to{
transform:scale(1.25);
background:orange;
}
}

.balloon{

width:clamp(35px,8vw,70px);
height:clamp(45px,10vw,90px);

border-radius:50%;
position:absolute;
cursor:pointer;
animation:float linear infinite;
}

.balloon::after{
content:"";
position:absolute;
width:2px;
height:80px;
background:white;
left:50%;
top:90px;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-140vh);
}
}

.sparkle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite;
}

@keyframes twinkle{
50%{
opacity:.2;
transform:scale(2);
}
}

.pop{
animation:pop .35s forwards;
}

@keyframes pop{
to{
transform:scale(2);
opacity:0;
}
}
/* Tablets */

@media (max-width:768px){

    .cake{
        transform:scale(.85);
    }

    .message{
        padding:0 15px;
    }

}

/* Phones */

@media (max-width:480px){

    h1{
        margin-top:20px;
    }

    .cake{
        transform:scale(.7);
        margin-top:20px;
    }

    .message{

        font-size:16px;

        line-height:1.6;

        padding:0 20px;

    }

    .balloon{

        width:40px;

        height:55px;

    }

}

</style>

</head>
<body>

<canvas id="fireworks"></canvas>

<div class="container">

<h1 id="title"></h1>

<div class="message">

May your special day be filled with happiness,
love, laughter, wonderful surprises,
and countless blessings!

</div>

<div class="cake">

<div class="layer layer1">
<div class="icing"></div>
</div>

<div class="layer layer2">
<div class="icing"></div>
</div>

<div class="layer layer3">

<div class="icing"></div>

<div class="candle c1">
<div class="flame"></div>
</div>

<div class="candle c2">
<div class="flame"></div>
</div>

<div class="candle c3">
<div class="flame"></div>
</div>

</div>

</div>

</div>

<script>

const celebrant="Mama Vicky";

document.getElementById("title").innerHTML=
"🎉 Happy Birthday, "+celebrant+"! 🎉";

//////////////////////////////////////////////////
// BALLOONS
//////////////////////////////////////////////////

const colors=[
"#ff4d6d",
"#ffbe0b",
"#00bbf9",
"#8338ec",
"#06d6a0",
"#fb5607"
];

function balloon(){

let b=document.createElement("div");

b.className="balloon";

b.style.left=Math.random()*100+"vw";
b.style.background=colors[Math.floor(Math.random()*colors.length)];
b.style.animationDuration=8+Math.random()*8+"s";

b.onclick=function(){

this.classList.add("pop");

setTimeout(()=>{
this.remove();
balloon();
},300);

}

document.body.appendChild(b);

}

const balloonCount =
window.innerWidth < 600 ? 10 : 20;

for(let i=0;i<balloonCount;i++)
    balloon();

//////////////////////////////////////////////////
// SPARKLES
//////////////////////////////////////////////////

for(let i=0;i<120;i++){

let s=document.createElement("div");

s.className="sparkle";

s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";

s.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(s);

}

//////////////////////////////////////////////////
// FIREWORKS
//////////////////////////////////////////////////

const canvas=document.getElementById("fireworks");

const ctx=canvas.getContext("2d");

function resize(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

resize();

window.onresize=resize;

let particles=[];

function firework(){

const x=Math.random()*canvas.width;
const y=Math.random()*canvas.height*.5;

const amount =
window.innerWidth < 600 ? 35 : 80;

for(let i=0;i<amount;i++)

particles.push({

x:x,
y:y,

dx:(Math.random()-.5)*8,
dy:(Math.random()-.5)*8,

life:100,

color:colors[Math.floor(Math.random()*colors.length)]

});

}

}

setInterval(firework,1200);

function animate(){

requestAnimationFrame(animate);

ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach((p,index)=>{

p.x+=p.dx;

p.y+=p.dy;

p.dy+=0.03;

p.life--;

ctx.beginPath();

ctx.arc(p.x,p.y,2,0,Math.PI*2);

ctx.fillStyle=p.color;

ctx.fill();

if(p.life<=0)
particles.splice(index,1);

});

}

animate();

</script>

</body>
</html>
