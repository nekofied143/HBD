<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Happy Birthday</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;600&display=swap"
        rel="stylesheet"
    >

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fireworks Canvas -->
    <canvas id="fireworks"></canvas>

    <!-- Main Content -->
    <div class="container">

        <h1 id="title"></h1>

        <div class="message">
            May your special day be filled with happiness,
            love, laughter, wonderful surprises,
            and countless blessings!
        </div>

        <!-- Birthday Cake -->
        <div class="cake">

            <div class="layer layer1">
                <div class="icing"></div>
            </div>

            <div class="layer layer2">
                <div class="icing"></div>
            </div>

            <div class="layer layer3">

                <div class="icing"></div>

                <div class="candle c1">
                    <div class="flame"></div>
                </div>

                <div class="candle c2">
                    <div class="flame"></div>
                </div>

                <div class="candle c3">
                    <div class="flame"></div>
                </div>

            </div>

        </div>

    </div>

    <!-- Script -->
    <script src="script.js"></script>

</body>

</html>
